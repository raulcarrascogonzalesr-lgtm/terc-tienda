# Publica la tienda en el hosting (cPanel con "Setup Node.js App") cada vez que se actualiza main.
#
# Configurar una vez en GitHub > Settings > Secrets and variables > Actions:
#   Secrets:   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   Variables: NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY
# Las claves secretas del servidor (SUPABASE_SERVICE_ROLE_KEY, MERCADOPAGO_ACCESS_TOKEN)
# se cargan directamente en cPanel, en la app Node.js, no aquí.

name: Publicar en el hosting

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      # Se sube por FTPS (cifrado) usando el nombre del servidor que aparece en su certificado;
      # con el nombre de FTP_SERVER el certificado no calza. Es el mismo servidor.
      FTPS_HOST: s510.v2nets.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint

      - name: Construir la tienda
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Armar la carpeta a subir
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          # En cPanel (CloudLinux) node_modules es un enlace administrado por el panel:
          # las dependencias se instalan con el botón "Ejecutar NPM Install", no se suben.
          rm -rf .next/standalone/node_modules
          # El aviso de reinicio va en una carpeta aparte y se sube al final (ver más abajo).
          mkdir -p .next/reinicio/tmp
          date > .next/reinicio/tmp/restart.txt

      # La subida va en dos partes. Si el aviso de reinicio llega mientras todavía se están
      # subiendo los archivos, el servidor arranca con una mezcla de archivos viejos y nuevos
      # y las páginas dan error 500 hasta el siguiente reinicio. Por eso primero se suben
      # todos los archivos (sin tocar tmp/) y recién después el aviso.
      - name: Subir por FTPS
        # Mientras no estén cargados los datos FTP, el flujo solo comprueba que la tienda compila.
        if: ${{ github.event_name != 'pull_request' && env.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTPS_HOST }}
          protocol: ftps
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: .next/standalone/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            tmp/**

      - name: Reiniciar la tienda
        if: ${{ github.event_name != 'pull_request' && env.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTPS_HOST }}
          protocol: ftps
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: .next/reinicio/
          server-dir: ./
          state-name: .ftp-deploy-reinicio.json

      # Después de publicar, se abre la tienda para ver que responde. Si da error,
      # se reinicia una vez más y se vuelve a revisar; si sigue mal, el flujo queda en rojo.
      - name: Revisar que la tienda responde
        id: revisar
        if: ${{ github.event_name != 'pull_request' && env.FTP_SERVER != '' }}
        continue-on-error: true
        run: bash .github/scripts/revisar-tienda.sh "${{ vars.NEXT_PUBLIC_SITE_URL || 'https://terc.cl' }}"

      - name: Preparar otro reinicio
        if: ${{ steps.revisar.outcome == 'failure' }}
        run: date > .next/reinicio/tmp/restart.txt

      - name: Reiniciar la tienda otra vez
        if: ${{ steps.revisar.outcome == 'failure' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTPS_HOST }}
          protocol: ftps
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: .next/reinicio/
          server-dir: ./
          state-name: .ftp-deploy-reinicio.json

      - name: Revisar otra vez
        if: ${{ steps.revisar.outcome == 'failure' }}
        run: bash .github/scripts/revisar-tienda.sh "${{ vars.NEXT_PUBLIC_SITE_URL || 'https://terc.cl' }}"
