# Revisa una vez por semana (y en cada cambio propuesto) que la tienda en línea no deje
# nada privado a la vista. Solo lee: no publica ni cambia nada.

name: Revisión de seguridad

on:
  pull_request:
  schedule:
    - cron: "0 12 * * 1" # lunes, 9:00 hora de Chile
  workflow_dispatch:

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar terc.cl desde afuera
        run: bash .github/scripts/revisar-seguridad.sh "${{ vars.NEXT_PUBLIC_SITE_URL || 'https://terc.cl' }}"
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
